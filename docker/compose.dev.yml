# Yerel geliştirme altyapısı. Uygulamanın kendisi burada çalışmaz (pnpm dev ile çalışır).
name: scrum-manager-dev

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: scrum
      POSTGRES_PASSWORD: scrum
      POSTGRES_DB: scrum_dev
    ports:
      # 5432 makinede başka bir Postgres tarafından kullanılıyor olabilir.
      - '5433:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U scrum -d scrum_dev']
      interval: 5s
      timeout: 3s
      retries: 10

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - '1025:1025' # SMTP
      - '8025:8025' # Web arayüzü: http://localhost:8025

volumes:
  postgres-data:
